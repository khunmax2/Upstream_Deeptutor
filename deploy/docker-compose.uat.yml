# ============================================
# Local UAT — one origin, shaped like the deployment
# ============================================
# Adds an nginx in front so both products answer on one origin, which is what
# the deployment does and what several of this design's properties depend on.
# Use it as a THIRD file, after the base and the studio overlay:
#
#   docker compose -f docker-compose.yml \
#                  -f deploy/docker-compose.openmaic.yml \
#                  -f deploy/docker-compose.uat.yml up -d
#
# Then open http://localhost:8080/deepwitya
#
# Required in the environment, on top of what the studio overlay needs:
#   OPENMAIC_IMAGE               built by deploy/build-studio.sh
#   OPENMAIC_POSTGRES_PASSWORD
#
# DeepWitya must be built with NEXT_PUBLIC_BASE_PATH=/deepwitya. That is a build
# argument compiled into its bundle, so it is set below and a rebuild is needed
# if it changes -- the same rule the studio image follows.
#
# NOT a production file. It publishes port 8080 in the clear and terminates no
# TLS; the deployment's nginx does both and lives on the host, not here.
# ============================================

services:
  deeptutor:
    build:
      args:
        # Compiled into the browser bundle. The studio image is built for
        # /deepwitya/studio, and nginx routes by longest prefix, so these two
        # values have to be chosen together.
        NEXT_PUBLIC_BASE_PATH: /deepwitya
    environment:
      # A same-origin path, so the studio page frames it directly. The embed
      # resolver treats a leading "/" as same-origin and rejects "//host",
      # which would leave this origin while reading like a local route.
      - DEEPTUTOR_OPENMAIC_URL=/deepwitya/studio

  openmaic:
    # Docker Desktop forwards the embedded resolver (127.0.0.11) to the host's
    # DNS, and for some public names that path drops answers: measured for a
    # Tailscale Funnel host (*.ts.net) at 8 failures in 12 lookups from inside
    # this container, while the Windows host resolved it 12/12 and every
    # api.openai.com / github.com lookup passed. The studio's SSRF guard turns
    # a failed lookup into "Unable to verify hostname safety" (403) and the
    # provider probe into "fetch failed" -- the same click answering three
    # different things. Naming the forwarders directly: 24/24. Service names
    # still resolve; the embedded resolver keeps those and only forwards the
    # rest. The deploy host runs its own resolver and does not need this.
    dns:
      - 1.1.1.1
      - 1.0.0.1

  gatekeeper:
    environment:
      # LOGIN_URL, not DEEPTUTOR_LOGIN_URL. The studio overlay writes
      # `LOGIN_URL=${DEEPTUTOR_LOGIN_URL:-}`, and that substitution reads the
      # HOST's environment, not this service's -- so setting the outer name here
      # puts a variable in the container that nothing reads, and leaves LOGIN_URL
      # empty. The gate then refuses with a message that cannot say where to
      # sign in. Found by reading `printenv` inside the container rather than the
      # file.
      - LOGIN_URL=/deepwitya/login

  nginx:
    image: nginx:1.27-alpine
    container_name: deeptutor-uat-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UAT_PORT:-8080}:80"
    volumes:
      - ./deploy/uat/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      deeptutor:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    networks:
      - deeptutor-network
      - studio-net
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
