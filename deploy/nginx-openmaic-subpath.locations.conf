# ============================================
# OpenMAIC embed — nginx location block (subpath, no extra port)
# ============================================
# The alternative to deploy/nginx-openmaic.locations.conf, for a host where a
# second port cannot be opened. Use one or the other, not both: they are two
# shapes of the same embed, and `data/user/settings/openmaic.json` points at
# exactly one of them.
#
#   port shape     https://HOST:10330                 — separate origin
#   subpath shape  https://HOST/course-studio-app     — same origin as DeepTutor
#
# What the subpath costs, and it is not nothing:
#
#   - Same origin means one `localStorage`. OpenMAIC keeps `providersConfig`
#     there, which can hold provider API keys, so an XSS anywhere in DeepTutor
#     could read them. Today the key names do not collide (DeepTutor namespaces
#     everything `deeptutor-*` / `deeptutor:*` / `panel:*`; OpenMAIC uses bare
#     `theme`, `locale`, `providersConfig`), so nothing breaks — but the
#     isolation the port shape gives for free is gone.
#   - The app must be BUILT for this path. `NEXT_PUBLIC_BASE_PATH` is compiled
#     into the bundle; pointing nginx at an image built without it serves a page
#     that 404s on its own chunks.
#
# What it buys: the studio is reachable on the port that is already open, and
# theme and language sync between the two apps with no patch, because on one
# origin they are literally the same `localStorage` keys.
#
# ⚠️ This host is shared. It already serves /sansarnnews, /research-helper,
# /dol, /deepwitya, /opdc-assistant and /deepwitya2 from the same :443 block.
# This file only ADDS one unique prefix and touches no existing location. Do
# NOT be tempted to add a root `location /api` to "fix" the studio's API calls:
# `/api` at the root of this host does not belong to us, and a rule there would
# sit in front of every other application on it. The app is built to prefix its
# own API calls instead — see integration/maic/components/base-path-bridge.tsx.
#
# Apply (needs sudo):
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================


# PASTE INSIDE the existing `listen 443 ssl` server block in
# /etc/nginx/sites-available/sansarnnews-ssl — next to `location /deepwitya2`,
# ABOVE any catch-all. Longest-prefix wins, so it does not matter whether it
# sits before or after the shorter prefixes.

location /course-studio-app {
    # NO trailing slash on proxy_pass. With one, nginx strips the prefix before
    # forwarding, and the app — built with basePath=/course-studio-app — then
    # sees paths it does not serve. The same lesson as /deepwitya2.
    #
    # Loopback: the gatekeeper must not be reachable except through here, or the
    # gate can be walked around.
    proxy_pass http://127.0.0.1:10331;

    # No `add_header Content-Security-Policy` here, for two reasons. The app
    # already sends its own `frame-ancestors`, which always includes 'self' and
    # is therefore satisfied by a same-origin frame with no build argument at
    # all. And an `add_header` inside a location REPLACES every add_header
    # inherited from the server block, so adding one here would silently drop
    # whatever security headers this host already sets for its other apps.

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Course generation streams for minutes at a time; buffering would hold the
    # response until the whole thing finished.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Uploaded course material — PDFs, slide decks, media.
    client_max_body_size 210m;
}
