# One origin for local UAT, shaped like the deployment.
#
# The two products are joined by being same-origin: that is what lets `dt_token`
# ride along to the gatekeeper under SameSite=Lax, and what satisfies the
# studio's own `frame-ancestors 'self'` with no configuration on its side. Run
# them on two ports instead and neither holds — the cookie is not sent and the
# browser refuses the frame, which is a confusing pair of symptoms for one
# cause.
#
# Prefix lengths do the routing. nginx picks the LONGEST matching prefix, so
# /deepwitya/studio wins over /deepwitya without either needing to know about
# the other. That is the same property the real host relies on to let us add a
# location under our own path without touching a rule that belongs to another
# team.
server {
    listen 80;
    server_name _;

    # Keep redirects relative. nginx expands a `return 302 /path` into an
    # absolute URL built from $host, which drops the published port -- so the
    # root redirect sent a browser on :8080 to http://localhost/deepwitya and it
    # landed nowhere.
    absolute_redirect off;
    client_max_body_size 200m;

    # The studio, through its gatekeeper. NO trailing slash on proxy_pass: the
    # studio is built with basePath=/deepwitya/studio and serves its assets
    # under it, so stripping the prefix here would 404 every /_next/ request.
    location /deepwitya/studio {
        proxy_pass http://gatekeeper:10330;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation streams; buffering turns a live progress feed into one
        # silent wait followed by everything at once.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # DeepWitya, built with NEXT_PUBLIC_BASE_PATH=/deepwitya. Same reason for no
    # trailing slash.
    location /deepwitya {
        proxy_pass http://deeptutor:3782;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nothing at the root on purpose. The shared host has other teams there, and
    # a catch-all here would hide the fact that neither product owns it.
    location = / {
        return 302 /deepwitya;
    }
}
