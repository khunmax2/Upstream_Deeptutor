# ============================================
# OpenMAIC — sibling service for the /maic embed
# ============================================
# OpenMAIC (https://github.com/THU-MAIC/OpenMAIC, MIT) is framed by this app at
# /maic. It is a whole second application, not a library: it cannot be merged
# into web/ because it ships Tailwind v4 against our v3, and its 69 Next API
# routes collide with `web/proxy.ts`, which forwards every /api/* path to
# FastAPI. So it runs beside us and we point an iframe at it.
#
# Usage (from the repo root, with OpenMAIC checked out as a sibling directory):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f deploy/docker-compose.openmaic.yml up -d
#
# Then tell the frontend where it lives, either with the environment variable
#
#   DEEPTUTOR_OPENMAIC_URL=http://localhost:3100
#
# or in data/user/settings/integrations.json:
#
#   "openmaic": { "embed_url": "http://localhost:3100" }
#
# ⚠️ Two things this file deliberately does NOT do — see deploy/OPENMAIC_EMBED.md
#    before exposing any of this publicly:
#
#    1. (resolved) OpenMAIC used to be reachable without DeepTutor's auth gate:
#       `web/proxy.ts` only guards routes Next serves, and a request sent
#       straight to this container never passed through it. The `gatekeeper`
#       service below now verifies the DeepTutor session in front of it — see
#       deploy/openmaic-gatekeeper/README.md.
#    2. It does not enable the Pro agent workbench. That needs DATABASE_URL and
#       therefore the `server-persistence` profile below; the classic one-click
#       generator works without it, browser-side.
# ============================================

services:
  openmaic:
    build:
      # Relative to the PROJECT directory (the repo root, from the first -f
      # file), not to this file's own `deploy/` directory — so this resolves
      # to a sibling checkout of the repo, e.g. D:/Vscode/OpenMAIC next to
      # D:/Vscode/Upstream_Deeptutor. Verified with `docker compose config`.
      #
      # That directory does not exist on a fresh host, and there is no second
      # repository to clone it from: OpenMAIC stays a pristine mirror of
      # upstream and everything of ours is a patch in this repo. Create it with
      #
      #     ./deploy/openmaic-fetch.sh
      #
      # which clones upstream at the pinned commit, applies every patch, and
      # reconciles the lockfile. Running `build` before that fails on a missing
      # context, or — worse — succeeds against an unpatched tree.
      context: ../OpenMAIC
      args:
        # Compiled into the browser bundle at build time. Without our origin
        # here, OpenMAIC's own `frame-ancestors 'self'` refuses the iframe and
        # the page renders blank with only a console error.
        - ALLOWED_FRAME_ANCESTORS=${DEEPTUTOR_PUBLIC_ORIGIN:-http://localhost:3782}
    container_name: deeptutor-openmaic
    # No `ports` on purpose. Reachable only from the compose network, so the
    # only route in is the gatekeeper. Publishing a port here — even on
    # loopback — is a way around the gate for anything already on the host.
    environment:
      # Leave ACCESS_CODE unset: OpenMAIC's access cookie is SameSite=Lax and
      # does not survive a cross-origin frame, so enabling it here locks the
      # embed out rather than securing it.
      - NODE_ENV=production
    volumes:
      - openmaic-data:/app/data
    networks:
      - deeptutor-network
    restart: unless-stopped

  # Verifies the DeepTutor session before anything reaches OpenMAIC, and strips
  # `dt_token` on the way through so OpenMAIC never holds a session token that
  # belongs to another application. nginx terminates TLS on :10330 and forwards
  # here; see deploy/nginx-openmaic.locations.conf.
  gatekeeper:
    image: node:22-alpine
    container_name: deeptutor-openmaic-gatekeeper
    command: ["node", "/app/gatekeeper.mjs"]
    working_dir: /app
    volumes:
      # Relative to the PROJECT directory (repo root), not to this file's own
      # deploy/ directory — the same resolution rule noted on build.context
      # above, and the same one that bit here first: ./openmaic-gatekeeper
      # resolved to a path that does not exist and the container restart-looped
      # on MODULE_NOT_FOUND.
      - ./deploy/openmaic-gatekeeper:/app:ro
    ports:
      # Loopback only: nginx is the sole route in. Publishing this on 0.0.0.0
      # would expose the gate's own port and defeat the TLS termination above.
      - "127.0.0.1:10331:10331"
    environment:
      - PORT=10331
      - OPENMAIC_UPSTREAM=http://openmaic:3000
      # Must point at a DeepTutor that can see the same cookie. On the current
      # host that is the IP with its subpath, because there is no domain.
      - DEEPTUTOR_AUTH_URL=${DEEPTUTOR_AUTH_URL:-https://203.185.144.41/deepwitya2/api/auth/status}
      - LOGIN_URL=${DEEPTUTOR_LOGIN_URL:-https://203.185.144.41/deepwitya2/login}
      - AUTH_CACHE_TTL_MS=${GATEKEEPER_AUTH_TTL_MS:-30000}
      # The documented escape hatch for a local trial, and it was missing from
      # this list — so `ALLOW_ANONYMOUS=1` reached the process from nowhere and
      # the one route past the gate that the docs offer twice did not exist.
      # Empty by default: the gate is on unless somebody says otherwise out loud.
      - ALLOW_ANONYMOUS=${GATEKEEPER_ALLOW_ANONYMOUS:-}
    # host.docker.internal is how a container reaches a DeepTutor running on the
    # host, which is the normal shape of a local trial. On Linux it does not
    # exist unless mapped, and without this the name simply fails to resolve —
    # indistinguishable, from inside the gatekeeper, from DeepTutor being down.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openmaic
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10331/__gatekeeper/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deeptutor-network
    restart: unless-stopped

  # Optional: durable server-side sessions for OpenMAIC's Pro agent workbench.
  # `lib/server/agent-runtime/store.ts` rejects outright without DATABASE_URL.
  openmaic-postgres:
    image: postgres:16
    container_name: deeptutor-openmaic-postgres
    profiles:
      - openmaic-persistence
    environment:
      - POSTGRES_DB=openmaic
      - POSTGRES_USER=openmaic
      - POSTGRES_PASSWORD=${OPENMAIC_POSTGRES_PASSWORD:-openmaic-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmaic -d openmaic"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - openmaic-postgres:/var/lib/postgresql/data
    networks:
      - deeptutor-network
    restart: unless-stopped

volumes:
  openmaic-data:
  openmaic-postgres:
