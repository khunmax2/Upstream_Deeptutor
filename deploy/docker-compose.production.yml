# ============================================
# Production overlay — DeepWitya + Course Studio under /deepwitya on the host
# ============================================
# The go-live shape of the stack that deploy/docker-compose.localhost.yml
# validated under /deepwitya2. Same container names and ports, so it takes
# over the validated stack in place (same data/, same volumes); what changes
# is the path the images are built for and the two lines that connect the
# app to the studio. deploy/GO-LIVE.md is the runbook.
#
#   docker compose -f docker-compose.yml \
#                  -f deploy/docker-compose.openmaic.yml \
#                  -f deploy/docker-compose.production.yml \
#                  --env-file data/user/settings/docker.env \
#                  --env-file deploy/production.env \
#                  up -d --build
#
# This file comes LAST: it sets the gatekeeper's LOGIN_URL, and a later file
# wins over the studio overlay's empty default.
#
# docker.env is generated by scripts/docker_compose.py (ports); production.env
# is written by hand from deploy/production.env.example (OPENMAIC_IMAGE by
# digest, the studio database password) and is gitignored.
#
# NEXT_PUBLIC_BASE_PATH is compiled into the DeepWitya image, exactly as the
# studio's base path is compiled into the studio image: neither can be changed
# by restarting, only by rebuilding. /deepwitya/studio sits under /deepwitya
# on purpose — nginx picks the longest matching prefix, so the studio location
# wins without either app knowing about the other.
# ============================================

services:
  deeptutor:
    container_name: deeptutor2
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /deepwitya
    environment:
      # bge-m3 on CPU: ~6 s per chunk, batches of 10 — the default 60 s
      # timeout fails a real document index (deploy/REDEPLOY.md §2.5b).
      DEEPTUTOR_EMBEDDING_TIMEOUT: "600"
      # Same-origin path to the studio, through the gatekeeper. Read on every
      # request, so it needs no rebuild; a restart is enough.
      DEEPTUTOR_OPENMAIC_URL: /deepwitya/studio
  redis:
    container_name: deeptutor2-redis
  pocketbase:
    container_name: pocketbase2
  sandbox-runner:
    container_name: deeptutor2-sandbox-runner
    security_opt:
      # kernel 6.8 + Docker 29 on this host: no-new-privileges makes the
      # runner's execve fail with EPERM (deploy/REDEPLOY.md §6).
      - "no-new-privileges:false"
  ollama:
    image: ollama/ollama:latest
    container_name: deeptutor2-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - deeptutor-network

  gatekeeper:
    environment:
      # Quoted back to a signed-out visitor of the studio path. Same origin,
      # so a path is enough.
      - LOGIN_URL=/deepwitya/login
