# ============================================
# OpenMAIC embed — nginx server block (port 10330)
# ============================================
# OpenMAIC runs on its own port so that it is a different origin from DeepTutor.
# Different port is enough for that: an origin is scheme + host + port, so
# https://203.185.144.41:10330 and https://203.185.144.41/deepwitya2 are
# separate origins and the browser keeps their localStorage apart.
#
# A subdomain would be better, because cookies are scoped by host and path and
# ignore the port — dt_token reaches this port too. But the certificate on this
# host has an IP SAN and no domain behind it, so a subdomain cannot be issued
# without acquiring one first. The gatekeeper strips dt_token before OpenMAIC
# sees it; that closes the leak for this app, not for the host.
#
# The existing certificate already covers every port on this IP, so nothing new
# has to be issued for this block.
#
#   cert: /etc/letsencrypt/live/203.185.144.41/fullchain.pem
#   renewal: snap.certbot.renew.timer
#
# Apply (needs sudo):
#   sudo nginx -t && sudo systemctl reload nginx
#
# Already syntax-checked offline against nginx:1.24-alpine (the host's version)
# and nginx:1.27-alpine, with the certificate paths pointed at a throwaway
# self-signed pair. 1.27 accepts it with a deprecation warning for
# `listen ... http2`; if the host is ever upgraded past 1.25, swap those two
# listen lines back to a bare `ssl` plus a separate `http2 on;`.
#
# Follows the same shape as deploy/nginx-deepwitya2.locations.conf: a separate
# file included by the server config, so no existing block is edited.
# ============================================

server {
    # `listen ... ssl http2` rather than the separate `http2 on;` directive:
    # the standalone form arrived in nginx 1.25 and the target host runs 1.24,
    # where it is an unknown directive and `nginx -t` refuses the whole config.
    # Checked against nginx:1.24-alpine, which is what caught it.
    listen 10330 ssl http2;
    listen [::]:10330 ssl http2;
    server_name 203.185.144.41;

    ssl_certificate     /etc/letsencrypt/live/203.185.144.41/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.185.144.41/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Only DeepTutor may frame this. The gatekeeper decides *who* may open it;
    # this decides *from where* it may be embedded, and the two are different
    # questions — a valid session opened from someone else's page is still a
    # clickjacking surface.
    #
    # No X-Frame-Options alongside it: that header only understands SAMEORIGIN,
    # and a different port is not the same origin, so adding it would refuse the
    # very embed this block exists to allow. frame-ancestors is the directive
    # that can name another origin, and every browser that matters honours it.
    add_header Content-Security-Policy "frame-ancestors https://203.185.144.41" always;

    # Course generation streams for minutes at a time; buffering it would hold
    # the response until the whole thing finished.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Uploaded course material — PDFs, slide decks, media.
    client_max_body_size 210m;

    location / {
        # Loopback: the gatekeeper must not be reachable except through here,
        # or the gate can simply be walked around.
        proxy_pass http://127.0.0.1:10331;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
